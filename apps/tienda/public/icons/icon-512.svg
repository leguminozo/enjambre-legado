  <!-- Floración Sagrada de Ulmo / Cruz Botánica (4 Pétalos Geométricos) -->
  <path d="M256 256 C235 213 235 150 256 139 C277 150 277 213 256 256Z" 
        fill="#C5A880" fill-opacity="0.18" stroke="#C5A880" stroke-width="4"/>
  <path d="M256 256 C235 299 235 362 256 373 C277 362 277 299 256 256Z" 
        fill="#C5A880" fill-opacity="0.18" stroke="#C5A880" stroke-width="4"/>
  <path d="M256 256 C213 235 150 235 139 256 C150 277 213 277 256 256Z" 
        fill="#C5A880" fill-opacity="0.18" stroke="#C5A880" stroke-width="4"/>
  <path d="M256 256 C299 235 362 235 373 256 C362 277 299 277 256 256Z" 
        fill="#C5A880" fill-opacity="0.18" stroke="#C5A880" stroke-width="4"/>

  <!-- Anillo Botánico Interior -->
  <circle cx="256" cy="256" r="42" stroke="#C5A880" stroke-width="2.5" stroke-dasharray="5 7" stroke-opacity="0.4"/>

  <!-- Núcleo / Gota de Cera Virgen Central -->
  <circle cx="256" cy="256" r="12" fill="#E2D9C8"/>
  <circle cx="256" cy="256" r="21" stroke="#C5A880" stroke-width="4" stroke-opacity="0.8"/>
</svg>

