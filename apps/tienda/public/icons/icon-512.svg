<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Fondo Verde Bosque Catedral Profundo -->
  <rect width="512" height="512" rx="100" fill="#071914"/>
  
  <!-- Borde interior sutil -->
  <rect x="22" y="22" width="468" height="468" rx="80" stroke="#C5A880" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Hexágono Territorial de Proveniencia (Línea Fina Oro Antiguo) -->
  <polygon points="256,101 390,178 390,334 256,411 122,334 122,178" 
